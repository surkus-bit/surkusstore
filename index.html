<title>SURKUS SMARTPHONE</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
:root{--n:#0a4fd6;--n2:#0b63f0;--dk:#031a4d;--g:#2aa1ff;--gold:#d4a017;--bg:#eef3fc;--t:#0f1f3d;--mut:#6a7a99;--ok:#1fa65f;--warn:#f08a1c;--bad:#e03a3a;--card:#fff;--sh:0 6px 22px #0a2a7a14}
*{box-sizing:border-box;margin:0;font-family:Inter,Segoe UI,Roboto,Arial,sans-serif;-webkit-tap-highlight-color:transparent}
body{background:radial-gradient(circle at 50% 0,#0b3fae,#031a4d 70%);min-height:100vh;color:var(--t)}
#app{max-width:430px;margin:0 auto;background:var(--bg);min-height:100vh;padding-bottom:96px;position:relative;box-shadow:0 0 50px #0009}
#app.noav{padding-bottom:0;background:#031a4d}
.hd{background:linear-gradient(135deg,#031a4d,#0a4fd6 85%);color:#fff;padding:14px 16px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:5;border-radius:0 0 26px 26px;box-shadow:0 8px 24px #0a4fd655}
.hd b{flex:1;font-size:17px;font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bk,.ic{background:#ffffff22;border:0;color:#fff;font-size:18px;cursor:pointer;width:36px;height:36px;border-radius:12px;flex:none;backdrop-filter:blur(6px)}
.pg{padding:16px 14px;animation:fi .3s}@keyframes fi{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.card{background:var(--card);border-radius:20px;padding:15px;margin-bottom:14px;box-shadow:var(--sh)}
.card>b:first-child{display:block;margin-bottom:8px;font-size:14px}
.ct{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}.ct b{font-size:14px}.ct small{color:var(--mut);font-size:11px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.tile{background:#fff;border-radius:16px;padding:12px;box-shadow:var(--sh)}.tile.s{text-align:center}
.tile b{display:block;font-size:19px;color:var(--n);line-height:1.1}.tile small{font-size:11px;color:var(--mut)}
.hero{background:linear-gradient(135deg,#3a86ff,#0a4fd6 55%,#062a8a);color:#fff;border-radius:26px;padding:18px;margin-bottom:16px;box-shadow:0 14px 30px #0a4fd666;position:relative;overflow:hidden}
.hero:before{content:"";position:absolute;left:-30px;bottom:-60px;width:170px;height:170px;border-radius:50%;background:#ffffff10}
.hero:after{content:"";position:absolute;right:-40px;top:-50px;width:170px;height:170px;border-radius:50%;background:#ffffff18}
.hero .who{display:flex;align-items:center;gap:10px;position:relative;z-index:1}
.av{width:44px;height:44px;border-radius:16px;background:#ffffff30;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px;flex:none}
.hero .who small{display:block;opacity:.8;font-size:11px}.hero .who b{font-size:15px;display:block}
.hero .big{margin-top:16px;position:relative;z-index:1}.hero .big small{opacity:.88;font-size:12px}
.hero .big b{display:block;font-size:30px;font-weight:800;letter-spacing:-.5px;margin:2px 0}
.sec{font-size:13px;font-weight:700;color:var(--t);margin:6px 2px 10px}
.qa{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
.qa div{background:#fff;border-radius:18px;padding:12px 4px;text-align:center;box-shadow:var(--sh);cursor:pointer;font-size:11px;font-weight:600;color:var(--t);transition:transform .12s}
.qa div:active{transform:scale(.94)}.qa i{display:flex;width:40px;height:40px;margin:0 auto 6px;border-radius:14px;background:linear-gradient(135deg,#e3eeff,#cfe1ff);align-items:center;justify-content:center;font-style:normal;font-size:19px}
.pipe{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.pt{background:#fff;border-radius:18px;padding:12px 11px;box-shadow:var(--sh);cursor:pointer;position:relative;transition:transform .12s;overflow:hidden}
.pt:active{transform:scale(.95)}.pt i{position:absolute;right:10px;top:12px;width:9px;height:9px;border-radius:50%}
.pt:after{content:"";position:absolute;left:0;bottom:0;height:3px;width:100%;background:var(--c,#ccc);opacity:.7}
.pt b{display:block;font-size:25px;color:var(--t);line-height:1.1}.pt small{font-size:11px;color:var(--mut)}
.kpi{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.kpi .k{background:#fff;border-radius:18px;padding:13px;box-shadow:var(--sh);min-width:0}
.kpi .k.w{grid-column:1/-1;background:linear-gradient(135deg,#0f9d58,#1fc16b);color:#fff}.kpi .k.w small{color:#ffffffd0}.kpi .k.w b{color:#fff}
.kpi small{font-size:11px;color:var(--mut);display:block}.kpi b{font-size:17px;color:var(--n);display:block;margin-top:2px;overflow:hidden;text-overflow:ellipsis}
.empty{color:var(--mut);font-size:12px;padding:6px 0}
input,select,textarea{width:100%;padding:12px;border:1.5px solid #d6e2fa;border-radius:13px;margin:4px 0 10px;font-size:14px;background:#f5f9ff;outline:none;color:var(--t);transition:.15s}
input:focus,select:focus{border-color:var(--g);background:#fff;box-shadow:0 0 0 4px #2aa1ff22}
input.err{border-color:#d33;background:#fff4f4}label{font-size:12px;font-weight:600;color:var(--n)}
.btn{background:var(--n);color:#fff;border:0;padding:10px 15px;border-radius:13px;font-weight:600;cursor:pointer;font-size:13px;margin:3px 3px 3px 0;transition:transform .1s,opacity .2s}
.btn:active{transform:scale(.96)}.btn:disabled{opacity:.5}
.btn.w{width:100%;padding:14px;font-size:15px;display:block;margin:7px 0}.btn.g{background:linear-gradient(135deg,#3da5ff,#0a57e0);box-shadow:0 6px 14px #0a57e044}.btn.l{background:#e1ebff;color:var(--n)}.btn.r{background:var(--bad)}
.row{display:flex;gap:6px;flex-wrap:wrap}.item{display:flex;gap:12px}
.item .ph{width:60px;height:80px;border-radius:14px;background:linear-gradient(135deg,#0a4fd6,#6fb8ff);flex:none;display:flex;align-items:center;justify-content:center;font-size:25px;overflow:hidden}
.item .ph img{width:100%;height:100%;object-fit:cover}
.item .in{flex:1;font-size:12px;color:#4a5d82;min-width:0}.item h4{font-size:15px;color:var(--t);margin-bottom:2px}
.bd{font-size:10px;font-weight:700;padding:4px 10px;border-radius:20px;float:right;color:#fff}
.b-gray{background:#7a88a3}.b-or{background:var(--warn)}.b-bl{background:#2d6fd6}.b-red{background:var(--bad)}.b-gr{background:var(--ok)}.b-gold{background:var(--gold)}
/* nav bawah simpel */
nav{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);width:calc(100% - 28px);max-width:402px;background:#ffffffee;backdrop-filter:blur(14px);display:flex;border-radius:26px;box-shadow:0 10px 34px #0a2a7a40;z-index:9;padding:6px}
nav button{flex:1;border:0;background:none;padding:8px 0 7px;font-size:10.5px;color:#8a98b5;cursor:pointer;border-radius:20px;font-weight:600;transition:.2s}
nav button i{display:block;font-style:normal;font-size:20px;margin-bottom:2px}
nav .on{color:#fff;background:linear-gradient(135deg,#3da5ff,#0a4fd6);box-shadow:0 6px 14px #0a4fd655}
/* drawer */
#drw{position:fixed;inset:0;background:#031a4d99;z-index:30;display:none;backdrop-filter:blur(3px);animation:fd .25s}
#drw>div{position:absolute;top:0;bottom:0;left:max(0px,calc(50% - 215px));width:80%;max-width:310px;background:var(--bg);border-radius:0 28px 28px 0;padding:18px 14px 22px;animation:sd .3s cubic-bezier(.2,.8,.2,1);overflow:auto;box-shadow:10px 0 40px #0006}
@keyframes sd{from{transform:translateX(-100%)}to{transform:none}}
@keyframes fd{from{opacity:0}to{opacity:1}}
.grab{width:44px;height:5px;background:#c3cfe8;border-radius:5px;margin:4px auto 14px}
.dtop{display:flex;align-items:center;gap:10px;margin-bottom:14px}.dtop b{flex:1;font-size:15px;color:var(--t);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dx{border:0;background:#e1ebff;color:var(--n);width:34px;height:34px;border-radius:12px;font-size:16px;cursor:pointer}
.dprof{position:relative;overflow:hidden;display:flex;align-items:center;gap:12px;background:linear-gradient(135deg,#062a8a,#0a4fd6 60%,#3a86ff);color:#fff;border-radius:22px;padding:16px;margin-bottom:12px;box-shadow:0 10px 24px #0a4fd655}
.dprof:after{content:"";position:absolute;right:-30px;top:-30px;width:110px;height:110px;border-radius:50%;background:#ffffff1a}
.dprof>*{position:relative;z-index:1}.dprof small{opacity:.85;font-size:11px;display:block}.dprof b{font-size:15px;display:block}
.dprof .rl{display:inline-block;margin-top:4px;background:#ffffff2e;padding:2px 9px;border-radius:12px;font-size:10px;font-weight:700;letter-spacing:.5px}
.dclock{background:#fff;border-radius:16px;padding:10px 14px;margin-bottom:14px;box-shadow:var(--sh);display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--mut)}.dclock b{font-size:15px;color:var(--n);font-variant-numeric:tabular-nums}
.dlb{font-size:10.5px;font-weight:700;letter-spacing:1px;color:var(--mut);margin:2px 4px 8px}
.dg{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.dg div{background:#fff;border-radius:16px;padding:10px 12px;display:flex;align-items:center;gap:12px;font-size:14px;font-weight:600;box-shadow:var(--sh);cursor:pointer;position:relative;transition:.15s}
.dg div:after{content:"›";margin-left:auto;color:#b4c2dd;font-size:20px}
.dg div:active{transform:scale(.97)}.dg i{display:flex;width:38px;height:38px;border-radius:13px;background:linear-gradient(135deg,#e8f1ff,#cfe1ff);align-items:center;justify-content:center;font-style:normal;font-size:19px;flex:none}
.dg div.cur{background:linear-gradient(135deg,#0a4fd6,#3a86ff);color:#fff;box-shadow:0 8px 18px #0a4fd655}.dg div.cur i{background:#ffffff30}.dg div.cur:after{color:#fff}
.dg div.out{color:var(--bad);margin-top:6px}.dg div.out i{background:#ffe7e7}
.dfoot{text-align:center;font-size:10.5px;color:var(--mut);margin-top:14px}
.chips{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;padding-bottom:2px;scrollbar-width:none}.chip{padding:8px 15px;border-radius:20px;background:#fff;font-size:12px;font-weight:600;white-space:nowrap;cursor:pointer;border:1px solid #d6e2fa;transition:.15s}.chip.on{background:var(--n);color:#fff;border-color:var(--n);box-shadow:0 5px 12px #0a4fd644}
.sw{display:flex;align-items:center;gap:10px;padding:11px 4px;border-bottom:1px solid #e8eefa}.sw:last-child{border:0}.sw span{flex:1;font-size:13px;min-width:0}.sw small{color:var(--mut)}
.sw input[type=checkbox]{width:44px;height:24px;margin:0;accent-color:var(--g)}
table{width:100%;border-collapse:collapse;font-size:12px}th{background:var(--n);color:#fff;padding:9px;text-align:left}td{padding:9px;border-bottom:1px solid #e3ebfa}
#mod{display:none;position:fixed;inset:0;background:#000a;z-index:40;align-items:center;justify-content:center;padding:14px}#mod>div{background:#fff;border-radius:22px;padding:18px;width:100%;max-width:400px;max-height:90vh;overflow:auto;animation:fi .2s}
#toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:#0c1a3a;color:#fff;padding:12px 18px;border-radius:14px;z-index:60;display:none;max-width:90%;box-shadow:0 6px 20px #0006}
#bar{position:fixed;top:0;left:0;height:3px;width:0;background:linear-gradient(90deg,#2aa1ff,#d4a017);z-index:70;transition:width .3s;opacity:0}
#ld{display:none;position:fixed;inset:0;background:#ffffff88;z-index:50;align-items:center;justify-content:center}
.sp{width:46px;height:46px;border-radius:50%;border:5px solid #c9dbfa;border-top-color:var(--n);animation:rot .7s linear infinite}@keyframes rot{to{transform:rotate(360deg)}}
/* grafik */
.cv{width:100%;display:block}.lgd{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:8px;font-size:11px;color:#4a5d82}.lgd i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px}
.dn{display:flex;align-items:center;gap:14px}.dn svg{width:132px;flex:none}.dn .lgd{flex-direction:column;margin:0;flex:1}.dn .lgd span{display:flex;justify-content:space-between;gap:6px}
.hb{margin:8px 0}.hb .l{display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px}.hb .l b{color:var(--t)}.hb .bg{height:9px;background:#e6eefc;border-radius:9px;overflow:hidden}.hb .bg i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,#3da5ff,#0a4fd6)}
.sm{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}.sm .k{background:#fff;border-radius:18px;padding:13px;box-shadow:var(--sh)}
.sm .k small{font-size:11px;color:var(--mut);display:block}.sm .k b{font-size:16px;color:var(--t);display:block;margin-top:2px}.sm .k em{font-style:normal;font-size:10.5px;font-weight:700;color:var(--ok)}
.sm .k.a{background:linear-gradient(135deg,#0a4fd6,#3a86ff);color:#fff}.sm .k.a small,.sm .k.a em{color:#ffffffd0}.sm .k.a b{color:#fff}
/* login */
.lg{min-height:100vh;position:relative;overflow:hidden;padding:46px 22px 28px;color:#fff;text-align:center;font-family:Montserrat,Inter,Segoe UI,Arial,sans-serif;background:radial-gradient(ellipse at 50% 18%,#1450d8 0,#0a2f93 38%,#04174f 75%,#020d33 100%)}
.lg *{font-family:inherit}
.lg:after{content:"";position:absolute;pointer-events:none;left:-20%;right:-20%;bottom:-70px;height:200px;border-radius:50%;border-top:3px solid #2aa1ff;box-shadow:0 -10px 40px #1e90ff77,inset 0 20px 50px #1e6bff55}
.lg>*{position:relative;z-index:1}
.lgl{width:130px;height:130px;margin:0 auto 20px;filter:drop-shadow(0 0 22px #1e90ffaa) drop-shadow(0 10px 20px #0008)}
.lgl img{width:100%;height:100%;display:block;border-radius:30px}
.lg h1{font-size:29px;font-weight:700}.lg .sub{font-size:14px;font-weight:500;opacity:.92;margin-top:8px}
.lg .bar2{width:56px;height:4px;border-radius:4px;background:linear-gradient(90deg,#2aa1ff,#7cc4ff);margin:16px auto 22px;box-shadow:0 0 12px #2aa1ff}
.lg .box{background:linear-gradient(180deg,#fff,#f1f6ff);border-radius:26px;padding:20px 18px 16px;color:var(--t);box-shadow:0 18px 50px #00092e99;text-align:left}
.lg .inp{display:flex;align-items:center;gap:10px;background:#eaf2ff;border:1.5px solid #cfe0fb;border-radius:16px;padding:0 14px;height:54px;margin-bottom:14px}
.lg .inp:focus-within{border-color:#1e6bff;background:#fff;box-shadow:0 0 0 4px #1e6bff22}
.lg .inp svg{width:22px;height:22px;flex:none;fill:#0a57e0}
.lg .inp input{border:0;background:transparent;margin:0;padding:0;height:100%;font-size:15px;font-weight:500;box-shadow:none}
.lg .eye{background:none;border:0;padding:4px;cursor:pointer;display:flex}.lg .eye svg{fill:#4a6a9e}
.lg .opt{display:flex;justify-content:space-between;align-items:center;margin:2px 0 16px;font-size:14px}
.lg .rm{display:flex;align-items:center;gap:9px;font-weight:600;cursor:pointer;font-size:14px}
.lg .rm input{position:absolute;opacity:0;width:0;height:0;margin:0}
.lg .cb{width:24px;height:24px;border-radius:7px;background:#fff;border:2px solid #9db8ea;display:inline-flex;align-items:center;justify-content:center}
.lg .rm input:checked+.cb{background:#0a57e0;border-color:#0a57e0}
.lg .rm input:checked+.cb:after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 3px 3px 0;transform:rotate(45deg) translate(-1px,-1px)}
.lg .opt a{color:#0a57e0;font-weight:700;cursor:pointer}
.lg .mbtn{width:100%;height:54px;border:0;border-radius:16px;color:#fff;font-size:17px;font-weight:700;letter-spacing:1px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:12px;background:linear-gradient(180deg,#1e7bff,#0a47d0);box-shadow:0 8px 20px #0a47d066}
.lg .mbtn svg{width:22px;height:22px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.lg .foot{margin-top:18px;text-align:center;color:#3b5588}
.lg .foot span{display:flex;align-items:center;gap:12px;font-size:13px;font-weight:700;letter-spacing:2px}
.lg .foot span:before,.lg .foot span:after{content:"";flex:1;height:1px;background:#bcd0f2}
.lg .foot small{display:block;margin-top:3px;font-size:12px;font-weight:500;color:#4a5d82}
.lg .tag{margin-top:28px;font-size:9.5px;font-weight:600;letter-spacing:1.2px;color:#6fb8ff}
.stamp{border:3px solid var(--ok);color:var(--ok);font-weight:800;padding:4px 12px;border-radius:8px;transform:rotate(-8deg);display:inline-block}
.top li{list-style:none;display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #e8eefa;font-size:13px}.top li:last-child{border:0}
.fab{position:fixed;right:max(14px,calc(50% - 201px));bottom:100px;z-index:8;border-radius:30px;padding:14px 20px;box-shadow:0 8px 20px #0a4fd677}
@media print{.hd,nav,.noprint,#drw,.fab,#toast,#ld,#bar{display:none!important}body{background:#fff}#app{box-shadow:none;max-width:100%;padding:0;background:#fff}.pg{padding:12mm}.card{box-shadow:none;border:1px solid #ccd;border-radius:8px}@page{margin:0}}
/* === v3: layar penuh di HP, bingkai HP di desktop === */

/* === SURKUS SMARTPHONE · penyegaran visual profesional === */
:root{--n:#155e75;--n2:#0e7490;--dk:#102a43;--g:#14b8a6;--gold:#c99a2e;--bg:#f3f6f8;--t:#172b3a;--mut:#718096;--ok:#16845b;--warn:#b96b12;--bad:#c43d4b;--card:#fff;--sh:0 3px 14px rgba(16,42,67,.055)}
html{background:#e8eef2}

const smooth=p=>{if(p.length<2)return '';let d=`M${p[0][0]},${p[0][1]}`;for(let i=1;i<p.length;i++){const a=p[i-1],b=p[i],cx=(a[0]+b[0])/2;d+=` C${cx},${a[1]} ${cx},${b[1]} ${b[0]},${b[1]}`}return d};

 const line=smooth(pts),fill=n>1?line+` L${X(n-1)},${T+ih} L${X(0)},${T+ih} Z`:'';

 [0,1,2,3].map(i=>{const y=T+ih-i*ih/3;return `<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" stroke="#e4ebf8" stroke-dasharray="3 3"/><text x="${L-5}" y="${y+3}" font-size="8.5" text-anchor="end" fill="#8a98b5">${sh(mx*i/3)}</text>`}).join('')+
 (fill?`<path d="${fill}" fill="url(#${id})"/><path d="${line}" fill="none" stroke="${col}" stroke-width="2.6" stroke-linecap="round"/>`:'')+
 pts.map((p,i)=>e[i][1]>0||n<=14?`<circle cx="${p[0]}" cy="${p[1]}" r="${n>20?2:3.2}" fill="#fff" stroke="${col}" stroke-width="2"/>`:'').join('')+
 e.map((x,i)=>i%k==0?`<text x="${X(i)}" y="${H-6}" font-size="8.5" text-anchor="middle" fill="#8a98b5">${x[0]}</text>`:'').join('')+`</svg>`};
const bars=(e,series=[['#3da5ff','#0a4fd6']],id='b1')=>{const W=320,H=150,L=34,B=22,T=10,R=8,vals=e.flatMap(x=>x.slice(1)),mx=Math.max(...vals,1),n=e.length,ns=series.length,iw=W-L-R,ih=H-B-T,gw=iw/n,bw=Math.min(24/ns,(gw-8)/ns);
 return `<svg class="cv" viewBox="0 0 ${W} ${H}"><defs>${series.map((s,j)=>`<linearGradient id="${id}${j}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${s[0]}"/><stop offset="1" stop-color="${s[1]}"/></linearGradient>`).join('')}</defs>`+
 [0,1,2,3].map(i=>{const y=T+ih-i*ih/3;return `<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" stroke="#e4ebf8" stroke-dasharray="3 3"/><text x="${L-5}" y="${y+3}" font-size="8.5" text-anchor="end" fill="#8a98b5">${sh(mx*i/3)}</text>`}).join('')+
 e.map((x,i)=>{const c=L+i*gw+gw/2;return series.map((s,j)=>{const v=x[j+1]||0,h=Math.max(v/mx*ih,v?3:0),bx=c-(bw*ns)/2+j*bw;return `<rect x="${bx}" y="${T+ih-h}" width="${bw-2}" height="${h}" rx="4" fill="url(#${id}${j})"/>`}).join('')+`<text x="${c}" y="${H-6}" font-size="8.5" text-anchor="middle" fill="#8a98b5">${x[0]}</text>`}).join('')+`</svg>`};

bandingkan:()=>{const cat=S.cat||[],ids=S.compareIds||[],selected=ids.map(id=>S.compareDetails[String(id)]||cat.find(x=>String(x.id)===String(id))).filter(Boolean);const fields=[['Harga',x=>Number(x.price)>0?rp(x.price):'Hubungi toko'],['RAM',x=>x.ram||'-'],['Memori internal',x=>x.rom||'-'],['Warna',x=>x.color||'-'],['Jaringan',x=>(x.specification||{}).network||'-'],['Ukuran layar',x=>(x.specification||{}).screen_size?String(x.specification.screen_size)+' inci':'-'],['Resolusi layar',x=>(x.specification||{}).screen_resolution||'-'],['Jenis panel',x=>(x.specification||{}).screen_type||'-'],['Chipset',x=>(x.specification||{}).chipset||'-'],['CPU / GPU',x=>(x.specification||{}).cpu_gpu||'-'],['Sistem operasi',x=>(x.specification||{}).os_version||'-'],['Kamera belakang',x=>(x.specification||{}).rear_camera||'-'],['Kamera depan',x=>(x.specification||{}).front_camera||'-'],['Baterai',x=>(x.specification||{}).battery_capacity?String(x.specification.battery_capacity)+' mAh':'-'],['Pengisian daya',x=>(x.specification||{}).charging_watt?String(x.specification.charging_watt)+' W':'-'],['Konektivitas',x=>(x.specification||{}).connectivity||'-'],['Port dan sensor',x=>(x.specification||{}).ports_sensors||'-'],['Kondisi fisik',x=>(x.specification||{}).physical_condition||'-'],['Catatan fungsi',x=>(x.specification||{}).fault_description||'Tidak dicatat'],['Kelengkapan',x=>(x.specification||{}).accessories||'-'],['Garansi toko',x=>(x.specification||{}).warranty_days!==undefined&&String((x.specification||{}).warranty_days)!=='0'?String(x.specification.warranty_days)+' hari':'Tidak ada'],['Status QC',x=>x.qc_status||'Belum ada data QC'],['Fungsi lulus QC',x=>(x.qc||[]).join(', ')||'-'],['Catatan hasil QC',x=>[(x.faults||[]).join(', '),(x.fault_reason||'')].filter(Boolean).join(' — ')||'-']];return `<div class="hd"><b>Bandingkan HP</b><button class="ic" title="Akun saya" onclick="nav('akun')">♙</button></div><div class="pg"><div class="buyer-section"><div><h3>Bandingkan spesifikasi</h3 lap:()=>{
 const all=okSales(),t=NOW(),td=dkey(t);let from,to=td;
 if(S.per=='7')from=dkey(new Date(t.getFullYear(),t.getMonth(),t.getDate()-6));
 else if(S.per=='30')from=dkey(new Date(t.getFullYear(),t.getMonth(),t.getDate()-29));
 else if(S.per=='bulan')from=dkey(new Date(t.getFullYear(),t.getMonth(),1));
 else if(S.per=='tahun')from=t.getFullYear()+'-01-01';
 else if(S.per=='semua')from=all.length?all.map(s=>String(s.sale_date).slice(0,10)).sort()[0]:td;
 else{from=S.from||dkey(new Date(t.getFullYear(),t.getMonth(),t.getDate()-29));to=S.to||td}
 const l=all.filter(s=>{const k=String(s.sale_date).slice(0,10);return k>=from&&k<=to}),
 om=l.reduce((a,s)=>a+ +s.final_total,0),lb=l.reduce((a,s)=>a+profit(s),0),avg=l.length?om/l.length:0,mg=om?lb/om*100:0,
 days=Math.round((pd(to)-pd(from))/864e5)+1,monthly=days>62;
 /* seri tren */
 let tr=[];if(!monthly){for(let i=0;i<days;i++){const x=new Date(pd(from).getFullYear(),pd(from).getMonth(),pd(from).getDate()+i);tr.push([dkey(x),days<=8?DN[x.getDay()]:x.getDate()+'/'+(x.getMonth()+1),0,0])}}
 else{const a=pd(from),b=pd(to);for(let y=a.getFullYear(),m=a.getMonth();y<b.getFullYear()||(y==b.getFullYear()&&m<=b.getMonth());m++){if(m>11){m=0;y++}tr.push([y+'-'+String(m+1).padStart(2,'0'),BN[m]+(days>400?" '"+String(y).slice(2):''),0,0]);if(m==11&&y<b.getFullYear()){}}}
 l.forEach(s=>{const k=String(s.sale_date).slice(0,monthly?7:10),e=tr.find(a=>a[0]==k);if(e){e[2]+=+s.final_total;e[3]+=profit(s)}});
 /* metode bayar */
 const mt={};l.forEach(s=>{const p=S.d.payments.find(x=>x.sale_id==s.sale_id),m=p?p.payment_method:'-';mt[m]=(mt[m]||0)+ +s.final_total});
 const mtI=Object.entries(mt).map(([k,v],i)=>[k,v,PAL[i%PAL.length],sh(v)]);
 /* merek & model */
 const br={},md={};l.forEach(s=>{const u=U(s.unit_id),b=u.brand||'Lainnya',m=((u.brand||'')+' '+(u.model||'')).trim();br[b]=(br[b]||0)+ +s.final_total;md[m]=md[m]||[0,0];md[m][0]++;md[m][1]+=profit(s)});
 const brI=Object.entries(br).sort((a,b)=>b[1]-a[1]).slice(0,6),mdI=Object.entries(md).sort((a,b)=>b[1][0]-a[1][0]).slice(0,5);
 /* stok */
 const stI=Object.keys(ST).map(k=>[ST[k][0],S.d.units.filter(u=>u.current_status==k).length,DOT[ST[k][1]]]).filter(x=>x[1]>0);
 const pend=S.d.sales.filter(s=>s.sale_status==='MENUNGGU_PEMBAYARAN').length;
 const admin=ROLE()==='SUPERADMIN',per=[['7','7 Hari'],['30','30 Hari'],['bulan','Bulan Ini'],['tahun','Tahun Ini'],['semua','Semua'],['x','Kustom']];
 return hd('Laporan','dash')+`<div class="pg"><div class="chips">${per.map(p=>`<span class="chip ${S.per==p[0]?'on':''}" onclick="S.per='${p[0]}';${p[0]=='x'?`S.from='${from}';S.to='${to}';`:''}render()">${p[1]}</span>`).join('')}</div>
 ${S.per=='x'?`<div class="row"><div style="flex:1"><label>Dari</label><input type="date" value="${S.from}" onchange="S.from=this.value;render()"></div><div style="flex:1"><label>Sampai</label><input type="date" value="${S.to}" onchange="S.to=this.value;render()"></div></div>`:''}
 <div class="sm"><div class="k a"><small>Total Omzet</small><b>${rp(om)}</b><em>${l.length} transaksi</em></div>
 ${admin?`<div class="k"><small>Laba Kotor</small><b style="color:var(--ok)">${rp(lb)}</b><em>Margin ${mg.toFixed(1)}%</em></div>`:`<div class="k"><small>Unit Terjual</small><b>${l.length}</b><em>unit</em></div>`}
 <div class="k"><small>Rata-rata / Transaksi</small><b>${rp(avg)}</b></div><div class="k"><small>Menunggu Pembayaran</small><b style="color:${pend?'var(--warn)':'var(--t)'}">${pend}</b><em style="color:var(--mut)">transaksi pending</em></div></div>
 ${['SUPERADMIN','OWNER','SUB_OWNER'].includes(ROLE())?`<button class="btn l w" onclick="nav('keu')">💰 Lihat rincian keuangan, modal & laba</button>`:''}
 <div class="card"><div class="ct"><b>Tren Omzet</b><small>${monthly?'per bulan':'per hari'}</small></div>${l.length?area(tr.map(x=>[x[1],x[2]]),'tr'):'<div class="empty">Belum ada penjualan pada periode ini</div>'}</div>
 ${admin&&l.length?`<div class="card"><div class="ct"><b>Omzet vs Laba</b><small>${monthly?'per bulan':'per hari'}</small></div>${bars(tr.map(x=>[x[1],x[2],x[3]]),[['#3da5ff','#0a4fd6'],['#4ade80','#16a34a']],'ol')}<div class="lgd"><span><i style="background:#0a4fd6"></i>Omzet</span><span><i style="background:#16a34a"></i>Laba</span></div></div>`:''}
 <div class="card"><div class="ct"><b>Metode Pembayaran</b><small>berdasarkan omzet</small></div>${mtI.length?donut(mtI,sh(om)):'<div class="empty">Belum ada data</div>'}</div>
 <div class="card"><div class="ct"><b>Omzet per Merek</b></div>${hbars(brI,v=>rp(v))}</div>

  sPot=sum(stock.filter(u=>u.current_status==='READY'),u=>{const p=PR(u.unit_id);return +p.final_price||((+p.selling_price||0)-(+p.discount||0))}),

 /* kas sederhana (sepanjang waktu) */

 if(['HP_MASUK','QC_GAGAL'].includes(s))b.push(`<button class="btn" onclick="svNew('${u.unit_id}')">Servis</button>`);

const katCards=()=>{
 const q=String(S.kq||'').toLowerCase().trim();

 if(S.cat===undefined||S.cat===null)return '<div class="buyer-grid"><div class="buyer-empty"><b>Memuat katalog…</b>Sebentar ya, kami sedang mengambil data HP.</div></div>';

 if(S.kbrand&&S.kbrand!=='SEMUA')list=list.filter(x=>String(x.brand||'').trim()===S.kbrand);
 if(S.ksort==='harga-naik')list.sort((a,b)=>(+a.price||0)-(+b.price||0));
 else if(S.ksort==='harga-turun')list.sort((a,b)=>(+b.price||0)-(+a.price||0));
 else if(S.ksort==='nama')list.sort((a,b)=>`${a.brand||''} ${a.model||''}`.localeCompare(`${b.brand||''} ${b.model||''}`,'id'));

/* ---------- v3: kalkulator harga jual (hanya hitung di layar; tidak menyentuh database) ---------- */
/* Definisi: Harga jual bersih = harga jual - diskon. Biaya total = modal + biaya tetap + (biaya % x harga bersih).
   Laba = harga bersih - biaya total. Margin = laba / harga jual bersih. Markup = laba / biaya total. */
const kalkCalc=({modal=0,extra=0,pct=0,price=0,disc=0})=>{
 const fixed=modal+extra,r=pct/100,net=Math.max(price-disc,0),cost=fixed+net*r,laba=net-cost;
 return{fixed,net,cost,laba,margin:net>0?laba/net*100:null,markup:cost>0?laba/cost*100:null,
  breakNet:r<1?fixed/(1-r):null,
  minNet:tm=>{const d=1-r-tm/100;return d>1e-9?fixed/d:null}}};
const kRp=v=>{v=String(v||'').replace(/[^\d]/g,'');return v?Math.min(+v,1e12):0};
const kPc=v=>{v=parseFloat(String(v||'').replace(',','.'));return isFinite(v)&&v>0?Math.min(v,99):0};
const kFmt=v=>v===null||v===undefined||!isFinite(v)?'-':(Math.round(v*10)/10).toLocaleString('id-ID')+'%';
const kalkPick=id=>{if(!id)return;const p=PR(id);$('#kc_modal').value=costOf(id)||'';$('#kc_price').value=+p.selling_price||'';$('#kc_disc').value=+p.discount||'';kalkHit()};
function kalkHit(){const g=i=>($('#'+i)||{}).value,o=$('#kc_out');if(!o)return;
 const p={modal:kRp(g('kc_modal')),extra:kRp(g('kc_extra')),pct:kPc(g('kc_pct')),price:kRp(g('kc_price')),disc:kRp(g('kc_disc'))},tm=kPc(g('kc_tm')),c=kalkCalc(p);
 const cl=v=>v<0?'color:#c43d4b':'color:#1fa65f';
 const minN=c.minNet(tm),warn=p.disc>p.price?'<div class="empty" style="color:#c43d4b">Diskon melebihi harga jual.</div>':'';
 o.innerHTML=`${warn}<div class="card"><b>Hasil</b>
 <div class="sw"><span>Harga jual bersih (setelah diskon)</span><b>${rp(c.net)}</b></div>
 <div class="sw"><span>Biaya total (modal + biaya)</span><b>${rp(c.cost)}</b></div>
 <div class="sw"><span>Laba</span><b style="${cl(c.laba)}">${rp(c.laba)}</b></div>
 <div class="sw"><span>Margin (atas harga jual)</span><b style="${cl(c.laba)}">${kFmt(c.margin)}</b></div>
 <div class="sw"><span>Markup (atas biaya)</span><b style="${cl(c.laba)}">${kFmt(c.markup)}</b></div>
 <div class="sw"><span>Harga impas (tanpa untung/rugi)</span><b>${c.breakNet===null?'-':rp(Math.ceil(c.breakNet)+p.disc)}</b></div>
 <div class="sw"><span>Harga minimum untuk margin ${kFmt(tm)}</span><b>${minN===null?'Tidak tercapai':rp(Math.ceil(minN)+p.disc)}</b></div>
 <small>Harga impas & minimum dihitung sebagai harga jual sebelum diskon, dengan diskon yang sama seperti di atas.</small></div>`;
 const list=String(g('kc_sim')||'').split(/[\n,;]+/).map(x=>kRp(x)).filter(x=>x>0).slice(0,30),so=$('#kc_simout');
 so.innerHTML=list.length?`<table><tr><th>Harga</th><th>Bersih</th><th>Laba</th><th>Margin</th></tr>${list.map(x=>{const k=kalkCalc(Object.assign({},p,{price:x}));return `<tr><td>${rp(x)}</td><td>${rp(k.net)}</td><td style="${cl(k.laba)}"><b>${rp(k.laba)}</b></td><td style="${cl(k.laba)}">${kFmt(k.margin)}</td></tr>`}).join('')}</table>`:'<small>Masukkan beberapa harga jual (pisahkan koma atau baris baru) untuk dibandingkan.</small>'}
const kalkView=()=>{const us=(S.d.units||[]).filter(u=>u.current_status!=='TERJUAL');setTimeout(kalkHit,0);
 const I=(id,l,ph,mode)=>`<label>${l}</label><input id="${id}" inputmode="${mode||'numeric'}" placeholder="${ph||''}" oninput="kalkHit()">`;
 return hd('Kalkulator Harga Jual','dash')+`<div class="pg"><div class="card"><b>Modal & biaya</b><small>Hanya untuk simulasi — tidak mengubah harga unit atau transaksi.</small>
 <label>Ambil modal & harga dari unit (opsional)</label><select id="kc_unit" onchange="kalkPick(this.value)"><option value="">— Isi manual —</option>${us.map(u=>`<option value="${esc(u.unit_id)}">${esc(u.brand)} ${esc(u.model)} · ${esc(ST[u.current_status]?ST[u.current_status][0]:u.current_status)}</option>`).join('')}</select>
 ${I('kc_modal','Modal / HPP unit (Rp)','0')}${I('kc_extra','Biaya tambahan tetap (Rp): packing, ongkir, komisi','0')}${I('kc_pct','Biaya variabel (% dari harga jual): fee platform / EDC','0','decimal')}</div>
 <div class="card"><b>Harga jual</b>${I('kc_price','Harga jual (Rp)','0')}${I('kc_disc','Diskon (Rp)','0')}<label>Target margin (%)</label><input id="kc_tm" inputmode="decimal" value="10" oninput="kalkHit()"></div>
 <div id="kc_out"></div>
 <div class="card"><b>Simulasi beberapa harga</b><label>Daftar harga jual (pisahkan koma / baris baru)</label><textarea id="kc_sim" rows="3" placeholder="2500000, 2650000, 2800000" oninput="kalkHit()"></textarea><div id="kc_simout" style="margin-top:8px"></div></div></div>`};

/* ===== Notifikasi lonceng (v3.2) =====
   Daftar diambil dari server dengan polling berkala (bukan real-time). Status baca/hapus tersimpan di server per pengguna.
   Browser hanya menyimpan daftar ID notifikasi yang sudah pernah di-toast (bukan isi, token, atau rahasia). */
let NOTIFS=[],NTF_UID=null,NTF_LOADED=false,NTF_BUSY=false,NTF_ERR='',NTF_SEEN=null,NTF_TT=0,NTF_OPEN=false;
const BELL='<svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>';
const ntfKey=()=>'sk_ntf_seen_'+(S.u?S.u.user_id:'');
function ntfSeenLoad(){let a=null;try{const r=localStorage.getItem(ntfKey());if(r!==null)a=JSON.parse(r)}catch(e){console.warn('Daftar notifikasi terlihat tidak terbaca',e)}NTF_SEEN=Array.isArray(a)?new Set(a):null}
function ntfSeenSave(){if(!NTF_SEEN||!S.u)return;try{localStorage.setItem(ntfKey(),JSON.stringify(Array.from(NTF_SEEN).slice(-300)))}catch(e){console.warn('Daftar notifikasi terlihat tidak tersimpan',e)}}
function ntfReset(){NOTIFS=[];NTF_LOADED=false;NTF_ERR='';NTF_SEEN=null;const t=$('#ntoast');if(t)t.style.display='none';closeNotif();if(S.u)ntfSeenLoad()}
const ntfUnread=()=>NOTIFS.filter(n=>!n.read_by).length;
function ntfBadge(){const c=ntfUnread();document.querySelectorAll('.nbadge').forEach(b=>{b.textContent=c>99?'99+':String(c);b.hidden=c<1});document.querySelectorAll('.nbell').forEach(b=>b.setAttribute('aria-label',c?('Notifikasi, '+c+' belum dibaca'):'Notifikasi'))}
function ntfItemsHTML(){
 if(!NTF_LOADED&&!NOTIFS.length)return '<div class="ntf-empty">Memuat notifikasi…</div>';
 const err=NTF_ERR?`<div class="ntf-err">${esc(NTF_ERR)} <a onclick="pollNotifs(true)">Coba lagi</a></div>`:'';
 if(!NOTIFS.length)return err+'<div class="ntf-empty">Belum ada notifikasi</div>';
 return err+NOTIFS.map(n=>{const open=n.link==='kat'&&ROLE()==='PEMBELI',id=esc(n.id);
  return `<div class="ntf-it ${n.read_by?'':'un'}"><div class="ntf-h"><b>${esc(n.title)}</b>${n.read_by?'':'<span class="ntf-new">BARU</span>'}</div><small>${esc(fmtDT(n.created_at))}</small><p>${esc(n.message)}</p><div class="ntf-a">${open?`<button class="ntb p" data-id="${id}" onclick="ntfOpen(this.dataset.id)">Lihat katalog</button>`:''}${n.read_by?'':`<button class="ntb" data-id="${id}" onclick="ntfRead(this.dataset.id)">Tandai dibaca</button>`}<button class="ntb d" data-id="${id}" onclick="ntfDel(this.dataset.id)">Hapus</button></div></div>`}).join('')}
function renderNtp(){const b=document.querySelector('#ntp .ntp-box');if(!b)return;const un=ntfUnread();
 b.innerHTML=`<div class="ntp-top"><b>Notifikasi${un?` <span class="ntf-new">${un} baru</span>`:''}</b><div class="ntp-act"><button class="ntb" ${un?'':'disabled'} onclick="ntfReadAll()">Tandai semua dibaca</button><button class="ntx" onclick="closeNotif()" aria-label="Tutup">✕</button></div></div><div class="ntp-list">${ntfItemsHTML()}</div>`}
function ntfRefreshUI(){if(!S.u)return;ntfBadge();if(NTF_OPEN)renderNtp();const l=$('#notifList');if(l)l.innerHTML=ntfItemsHTML()}
function ntfToast(list){const t=$('#ntoast');if(!t||!list.length)return;const f=list[0];
 t.innerHTML=list.length>1?`<b>${list.length} notifikasi baru</b><span>${esc(f.title)} dan lainnya</span>`:`<b>${esc(f.title)}</b><span>${esc(String(f.message).slice(0,90))}</span>`;
 t.style.display='block';clearTimeout(NTF_TT);NTF_TT=setTimeout(()=>{t.style.display='none'},5000)}
async function pollNotifs(manual){
 if(!S.t||!S.u||NTF_BUSY||(document.hidden&&!manual))return;
 const who=S.u.user_id;NTF_BUSY=true;
 try{
  const list=await api('getNotifications',S.t);
  if(!S.u||S.u.user_id!==who)return;
  NOTIFS=Array.isArray(list)?list:[];NTF_ERR='';
  const baseline=NTF_SEEN===null;if(baseline)NTF_SEEN=new Set();
  const fresh=NOTIFS.filter(n=>!n.read_by&&!NTF_SEEN.has(n.id));
  NOTIFS.forEach(n=>{if(!n.read_by)NTF_SEEN.add(n.id)});
  ntfSeenSave();NTF_LOADED=true;
  if(!baseline&&fresh.length)ntfToast(fresh);
 }catch(e){
  const m=String(e&&e.message||e).replace(/^Error:\s*/,'');
  if(m.indexOf('SESI_HABIS')>=0){S.u=S.t=S.d=null;try{localStorage.removeItem('sk_token');localStorage.removeItem('sk_token_exp')}catch(err){console.warn(err)}S.p='login';render();toast('Sesi berakhir. Silakan masuk kembali.');return}
  NTF_ERR='Gagal memuat notifikasi: '+m;NTF_LOADED=true;
 }finally{NTF_BUSY=false;ntfRefreshUI()}
}
const loadNotifications=()=>pollNotifs(true);
function ntfFail(e){toast(String(e&&e.message||e).replace(/^Error:\s*/,''))}
async function ntfRead(id){const n=NOTIFS.find(x=>x.id===id);if(!n||n.read_by)return;n.read_by=true;ntfRefreshUI();
 try{await api('markNotificationRead',S.t,id)}catch(e){n.read_by=false;ntfRefreshUI();ntfFail(e)}}
async function ntfReadAll(){const ids=NOTIFS.filter(n=>!n.read_by).map(n=>n.id);if(!ids.length)return;NOTIFS.forEach(n=>{n.read_by=true});ntfRefreshUI();
 try{await api('markAllNotificationsRead',S.t)}catch(e){NOTIFS.forEach(n=>{if(ids.indexOf(n.id)>=0)n.read_by=false});ntfRefreshUI();ntfFail(e)}}

(async function restoreSavedSession(){
  let token='', exp=0;
  try{token=localStorage.getItem('sk_token')||'';exp=Number(localStorage.getItem('sk_token_exp')||0)}catch(e){}
  if(!token)return;

  try{

})();
/* Sinkronisasi lintas perangkat: ambil data terbaru berkala tanpa login ulang.
   Apps Script tidak menyediakan push real-time, jadi perubahan muncul biasanya dalam 10–15 detik. */
let syncBusy=false, lastSyncSignature='';
async function syncConnectedDevices(){
  if(!S.t || !S.u || document.hidden || syncBusy || busyN>0) return;
  syncBusy=true;
  try{
    const fresh=await api('refresh',S.t,(S.d&&S.d.__v)||'');
    if(fresh&&fresh.same)return;if(fresh&&fresh.__v&&S.d&&fresh.__v===S.d.__v)return;
    const sig=JSON.stringify(fresh);
    if(sig!==lastSyncSignature && sig!==JSON.stringify(S.d)){
      const modalOpen=$('#mod').style.display==='flex';
      const active=document.activeElement;
      const editing=active && /^(INPUT|TEXTAREA|SELECT)$/.test(active.tagName);
      // Jangan menggambar ulang layar yang sedang mengandung isian atau alur transaksi.
      const LOCK_PAGES = ['form','qc','qris','spesifikasi','kalk'];
      if(!modalOpen && !editing && !LOCK_PAGES.includes(S.p)){ S.d=fresh; render(); }
      else { S.d=fresh; } // Data segar masuk memori, tetapi DOM/form yang sedang dikerjakan tetap utuh.
    }
    lastSyncSignature=sig;
  }catch(e){
    const m=String(e&&e.message||e);
    if(m.indexOf('SESI_HABIS')>=0){
      // Polling memperpanjang sesi selama perangkat tetap tersambung dan aktif.
      S.u=S.t=S.d=null; try{localStorage.removeItem('sk_token');localStorage.removeItem('sk_token_exp')}catch(err){} S.p='login'; render(); toast('Sesi berakhir. Silakan masuk kembali.');
    } else { toast('Koneksi terputus sementara. Data akan dicoba lagi otomatis.'); }
  }finally{syncBusy=false;}
}

/* ───────── 13. ANIMASI MASUK HALAMAN ───────── */
#app .pg{animation:none}
#app.enter .pg{animation:pgFade .5s var(--ease)}
#app.enter .pg>*:not(.pipe):not(.qa):not(.kpi):not(.sm):not(.buyer-stats):not(.buyer-trust):not(.buyer-shortcuts):not(.buyer-grid):not(#kl),
#app.enter :is(.pipe,.qa,.kpi,.sm,.buyer-stats,.buyer-trust,.buyer-shortcuts,.buyer-grid)>*{animation:riseIn .85s var(--ease) backwards;animation-delay:calc(min(var(--i,0),12)*55ms + 40ms)}

/* ───────── 14. KEYFRAMES ───────── */
@keyframes riseIn{from{opacity:0;transform:translateY(20px) scale(.985)}to{opacity:1;transform:none}}
@keyframes pgFade{from{opacity:0}to{opacity:1}}
@keyframes ripple{from{transform:scale(0);opacity:.9}to{transform:scale(1);opacity:0}}
@keyframes modalIn{from{opacity:0;transform:translateY(28px) scale(.93)}to{opacity:1;transform:none}}
@keyframes sheetIn{from{transform:translateY(100%)}to{transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,-22px) scale(.9)}to{opacity:1;transform:translate(-50%,0) scale(1)}}
@keyframes drawerIn{from{transform:translateX(-100%)}to{transform:none}}
@keyframes slideItem{from{opacity:0;transform:translateX(-26px)}to{opacity:1;transform:none}}
@keyframes navPop{0%{transform:translateY(8px) scale(.6)}60%{transform:translateY(-4px) scale(1.2)}100%{transform:none}}
@keyframes logoFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes drift{from{transform:translate3d(-2%,-1%,0)}to{transform:translate3d(2%,2%,0)}}
@keyframes gleam{from{background-position:135% 0,0 0}to{background-position:-135% 0,0 0}}
@keyframes pulseDot{0%{box-shadow:0 0 0 0 rgba(201,162,77,.6)}100%{box-shadow:0 0 0 10px rgba(201,162,77,0)}}
@keyframes fabIn{from{opacity:0;transform:translateY(34px) scale(.6)}to{opacity:1;transform:none}}

/* ───────── 15. CETAK & AKSESIBILITAS ───────── */
@media print{
 #app{background:#fff!important;box-shadow:none!important}
 :is(#app) .card{background:#fff!important;box-shadow:none!important;border:1px solid #ccc!important}
 #app *{animation:none!important;transition:none!important}
 #app th{background:#eee!important;color:#000!important}
 #app .hero .big b{-webkit-text-fill-color:#000;color:#000}
}
@media(prefers-reduced-motion:reduce){
 #app *,#mod *,#drw *,#app,#mod,#drw,#toast{animation:none!important;transition:none!important}
 .rpl{display:none}
}

<script>
/* Tema mewah: riak sentuhan, animasi masuk bertahap, warna bilah browser. Tidak mengubah logika aplikasi. */
(function(){
 'use strict';
 var app=document.getElementById('app'),drw=document.getElementById('drw'),
  SEL='.btn,.chip,.buyer-chip,.qa div,.dg div,.pt,.buyer-shortcut,nav button,.ic,.bk,.dx,.mbtn,.sw[onclick]',
  GR='.pipe,.qa,.kpi,.sm,.buyer-stats,.buyer-trust,.buyer-shortcuts,.buyer-grid',
  last='',timer=0;
 if(!app)return;
 try{var m=document.querySelector('meta[name="theme-color"]');if(m)m.setAttribute('content','#041441')}catch(e){}

 /* riak emas saat tombol disentuh */
 document.addEventListener('pointerdown',function(e){
  var el=e.target&&e.target.closest?e.target.closest(SEL):null;
  if(!el||el.disabled)return;
  var r=el.getBoundingClientRect(),s=Math.max(r.width,r.height)*2,
   d=document.createElement('span');
  d.className='rpl';
  d.style.cssText='width:'+s+'px;height:'+s+'px;left:'+(e.clientX-r.left-s/2)+'px;top:'+(e.clientY-r.top-s/2)+'px';
  el.appendChild(d);
  setTimeout(function(){if(d.parentNode)d.parentNode.removeChild(d)},800);
 },{passive:true});

 /* nomor urut untuk animasi bertahap */
 function each(list,fn){Array.prototype.forEach.call(list,fn)}
 function stagger(){
  var pg=app.querySelector('.pg');if(!pg)return;
  each(pg.children,function(el,p){
   el.style.setProperty('--i',p);
   var wraps=el.matches(GR)?[el]:el.querySelectorAll(GR);
   each(wraps,function(w){each(w.children,function(k,j){k.style.setProperty('--i',p+j)})});
  });
 }
 function sig(){try{return S.p+'|'+(Array.isArray(S.cat)?1:0)+(Array.isArray(S.sold)?1:0)}catch(e){return ''}}
 function enter(){
  last=sig();stagger();
  app.classList.add('enter');
  clearTimeout(timer);
  timer=setTimeout(function(){app.classList.remove('enter')},1600);
 }
 /* animasi masuk hanya saat berpindah halaman / data katalog selesai dimuat,
    bukan saat sinkronisasi otomatis, supaya layar tidak berkedip */
 new MutationObserver(function(){if(sig()!==last)enter()}).observe(app,{childList:true});
 /* drawer menu */
 if(drw)new MutationObserver(function(){each(drw.querySelectorAll('.dg>*'),function(el,i){el.style.setProperty('--i',i)})}).observe(drw,{childList:true});
 enter();
})();
</script>

<script>
(function(){
var K='sk_theme',R=document.documentElement;
function cur(){return R.getAttribute('data-theme')==='light'?'light':'dark'}
function paint(){var d=cur()==='dark';
 document.querySelectorAll('meta[name="theme-color"]').forEach(function(m){m.setAttribute('content',d?'#03050B':'#041441')});
 document.querySelectorAll('.tmb').forEach(function(b){b.textContent=d?'☀':'☾';b.title=d?'Mode terang':'Mode gelap';b.setAttribute('aria-label',b.title)});
 var r=document.querySelector('.tmrow');if(r)r.classList.toggle('on',d)}
window.toggleTheme=function(){var n=cur()==='dark'?'light':'dark';R.classList.add('tswap');R.setAttribute('data-theme',n);try{localStorage.setItem(K,n)}catch(e){}paint();setTimeout(function(){R.classList.remove('tswap')},500)};
function inject(){var app=document.getElementById('app');if(!app)return;
 app.querySelectorAll('.hd').forEach(function(h){if(!h.querySelector('.tmb')){var b=document.createElement('button');b.type='button';b.className='ic tmb';b.onclick=window.toggleTheme;h.appendChild(b)}});
 var lg=app.querySelector('.lg');if(lg&&!lg.querySelector('.tmb')){var c=document.createElement('button');c.type='button';c.className='tmb';c.onclick=window.toggleTheme;lg.appendChild(c)}
 paint()}
function drawer(){var d=document.getElementById('drw'),g=d&&d.querySelector('.dg');if(!g||g.querySelector('.tmrow'))return;
 var r=document.createElement('div');r.className='tmrow';r.innerHTML='<i>🌙</i>Mode Gelap<span class="sw2"></span>';
 r.onclick=function(e){e.stopPropagation();window.toggleTheme()};g.insertBefore(r,g.querySelector('.out'));paint()}
var a=document.getElementById('app'),d=document.getElementById('drw');
if(a)new MutationObserver(inject).observe(a,{childList:true});
if(d)new MutationObserver(drawer).observe(d,{childList:true});
inject();drawer();
})();
</script>

    '<div class="sb-top">'+logo(38)+'<b>'+esc(shopName())+'</b></div>'+
    '<div class="sb-prof" onclick="nav(\''+(ROLE()==='PEMBELI'?'akun':'profil')+'\')"><div class="av">'+avHTML()+'</div><div><b>'+esc(S.u.full_name)+'</b><small>'+esc(ROLE())+'</small></div></div>'+
    '<div class="sb-lb">MENU</div>'+
    items().map(function(x){
      var on=(cur===x[0])||(x[0]==='stok'&&cur==='form')||(x[0]==='jual'&&(cur==='inv'||cur==='qris'))||(x[0]==='akun'&&cur==='profil'&&ROLE()==='PEMBELI');
      return '<button type="button" class="sb-it'+(on?' on':'')+'" onclick="nav(\''+x[0]+'\')"><i>'+x[1]+'</i>'+esc(x[2])+'</button>';
    }).join('')+
    '<div class="sb-sp"></div>'+
    '<button type="button" class="sb-it out" onclick="doLogout()"><i>🚪</i>Keluar</button>'+
    '<div class="sb-clk" id="sbclk">'+esc(clockText())+'</div>';
  }catch(e){console.warn('Sidebar:',e)}
 }
 /* render() mengganti isi #app → bangun ulang sidebar setelah itu */
 if(app)new MutationObserver(build).observe(app,{childList:true});
 /* jam sidebar */
 setInterval(function(){if(document.hidden)return;var c=document.getElementById('sbclk');if(c)c.textContent=clockText()},1000);
 /* tombol kembali / aksi memanggil render() sendiri; ini jaring pengaman untuk perubahan S.p tanpa re-render */
 window.addEventListener('resize',function(){sig=''});
 build();
})();
</script>
